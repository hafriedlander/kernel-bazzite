name: Build Patched Bazzite

on:
  schedule:
    # Runs daily at 04:00 UTC to catch upstream Bazzite stable-43 updates
    - cron: '0 4 * * *' 
  release:
    # Triggers immediately when you publish a new kernel release in this repo
    types: [published]
  workflow_dispatch: # Allows you to trigger a build manually from the GitHub UI

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Latest Kernel RPMs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p my-kernel-rpms
          # The GitHub CLI downloads all .rpm assets from the latest release
          gh release download --pattern "*.rpm" --dir my-kernel-rpms/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the custom image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./bazzite_build/Containerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/bazzite-deck-cu40:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/bazzite-deck-cu40:stable-43
            ghcr.io/${{ github.repository_owner }}/bazzite-deck-cu40:latest
      
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.7.0

      - name: Sign image
        run: |
          IMAGE_DIGEST="ghcr.io/${{ github.repository_owner }}/bazzite-deck-cu40@$(podman inspect --format='{{index .RepoDigests 0}}' ghcr.io/${{ github.repository_owner }}/bazzite-deck-cu40:${{ github.sha }} | cut -d'@' -f2)"
          cosign sign --yes --key env://COSIGN_KEY "$IMAGE_DIGEST"
        env:
          SIGNING_SECRET: ${{secrets.SIGNING_SECRET}}
